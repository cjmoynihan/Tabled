[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabled"
version = "0.1.0"
description = "Board game recommender built on the BoardGameGeek ratings dump"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyarrow>=12",
]

[project.optional-dependencies]
model = ["scikit-learn>=1.3", "implicit>=0.7"]
app = ["streamlit>=1.30"]
dev = ["pytest>=7"]

[project.scripts]
tabled = "tabled.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
